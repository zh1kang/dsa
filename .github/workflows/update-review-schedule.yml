name: Update review schedule

on:
  push:
    paths:
      - tracker.json
      - review-log.json
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-review-schedule-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate derived files
        run: python scripts/update_review_schedule.py

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- tracker.json review-schedule.json google-sheets.csv mindsolve-log.csv; then
            echo "Derived files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.json review-schedule.json google-sheets.csv mindsolve-log.csv
          git commit -m "chore: update review schedule"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
